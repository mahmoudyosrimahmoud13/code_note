name: code_note
description: "CodeNote Community Edition: a local-only notebook for code, notes and ideas."
publish_to: 'none'

version: 1.10.0+11000

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  flutter_code_editor: ^0.3.2
  flutter_highlight: any
  highlight: any
  flutter_staggered_grid_view: ^0.7.0
  uuid: ^4.4.2
  google_mlkit_text_recognition: ^0.14.0
  widget_zoom: ^0.0.4
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  dartz: ^0.10.1
  get_it: ^9.2.1
  equatable: ^2.0.8
  flutter_markdown: ^0.7.3+2
  markdown: ^7.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  path: any
  http: any
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  webview_flutter: ^4.10.0
  file_saver: 0.2.14
  file_selector: ^1.1.0
  random_avatar: ^0.0.8
  cached_network_image: ^3.4.1
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/languages/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
